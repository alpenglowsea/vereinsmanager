name: "VereinsManager Release (Desktop und Handy)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (z. B. v2.0.0), muss zur Versionsnummer im Code passen'
        required: true
        default: 'v2.0.0'
      veroeffentlichen:
        description: 'Als Release veröffentlichen? "nein" = nur bauen, Pakete hängen am Lauf'
        required: true
        type: choice
        options:
          - 'nein'
          - 'ja'
        default: 'nein'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  # ------------------------------------------------------------------
  # Passt die Marke zur Versionsnummer im Code?
  #
  # Die Nummer steht an vier Stellen (Desktop dreimal, Handy einmal). Weicht
  # eine ab, meldet die App später eine falsche Version, und die
  # Versionsprüfung vergleicht falsch. Deshalb bricht der Bau hier ab, bevor
  # irgendetwas gebaut oder veröffentlicht wird.
  # ------------------------------------------------------------------
  pruefen:
    runs-on: ubuntu-latest
    env:
      VM_MARKE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionsnummern vergleichen
        run: |
          set -e
          SOLL="${VM_MARKE#v}"
          echo "Marke: $VM_MARKE  ->  erwartete Version: $SOLL"
          case "$VM_MARKE" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Die Marke muss die Form v2.0.0 haben, ist aber '$VM_MARKE'."; exit 1;; esac
          FEHLER=0
          pruefe() {
            if [ "$2" != "$SOLL" ]; then echo "::error::$1 hat Version '$2', die Marke verlangt '$SOLL'."; FEHLER=1; else echo "OK  $1: $2"; fi
          }
          pruefe package.json "$(node -p "require('./package.json').version")"
          pruefe src-tauri/tauri.conf.json "$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pruefe src-tauri/Cargo.toml "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          pruefe android/app/build.gradle.kts "$(sed -n 's/^val vmVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)"
          exit $FEHLER

  release:
    needs: pruefen
    permissions:
      contents: write
    env:
      # Einmal an einer Stelle entschieden, statt die Bedingung unten dreimal
      # auszuschreiben.
      #
      # Wird der Bau durch das Veröffentlichen einer Marke ausgelöst, soll immer
      # ein Release entstehen — dann gibt es das Auswahlfeld gar nicht.
      VM_VEROEFFENTLICHEN: ${{ github.event_name != 'workflow_dispatch' && 'ja' || github.event.inputs.veroeffentlichen }}
      VM_MARKE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: nur Apple Silicon. Die frühere Universal-Fassung enthielt
          # zusätzlich die Intel-Bauform — und damit künftig auch eine zweite
          # Node-Laufzeitumgebung. Doppelter Platzbedarf für Geräte, die nicht
          # mehr unterstützt werden sollen.
          #
          # Je Betriebssystem genau ein Paket (--bundles):
          #   macOS   -> .dmg
          #   Linux   -> .AppImage (läuft auf allen Distributionen, ohne Installation)
          #   Windows -> .exe (NSIS-Installer)
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage'
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Frontend Dependencies
        # npm ci installiert exakt die in package-lock.json festgeschriebenen
        # Versionen. Wichtig für reproduzierbare Releases: derselbe Tag ergibt
        # dieselben Abhängigkeiten, auch Monate später.
        run: npm ci --no-audit

      # Erzeugt dist/ (Oberfläche) UND dist/server.cjs (Server). Früher stand
      # hier nur "build:ui" — den Server brauchte die Desktop-Fassung ja nicht.
      - name: Build Frontend & Server
        run: npm run build

      # ------------------------------------------------------------------
      # Die Node-Laufzeitumgebung als Sidecar bereitstellen
      #
      # Genommen wird schlicht das Node, das im Schritt "Setup Node.js" ohnehin
      # auf dem Bau-Rechner steht. Das erspart einen Download samt Prüfsumme
      # und stellt sicher, dass ausgeliefert wird, womit auch gebaut wurde.
      #
      # Tauri verlangt im Dateinamen die Plattformkennung ("target triple").
      # rustc kennt sie; sie von Hand zu pflegen wäre eine Fehlerquelle.
      # ------------------------------------------------------------------
      - name: Node-Laufzeitumgebung als Sidecar bereitstellen
        run: |
          set -e
          mkdir -p src-tauri/binaries
          KENNUNG=$(rustc -vV | sed -n 's|^host: ||p')
          QUELLE=$(node -p "process.execPath")
          echo "Plattformkennung: $KENNUNG"
          echo "Node-Programmdatei: $QUELLE"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$QUELLE" "src-tauri/binaries/vm-node-$KENNUNG.exe"
          else
            cp "$QUELLE" "src-tauri/binaries/vm-node-$KENNUNG"
            chmod +x "src-tauri/binaries/vm-node-$KENNUNG"
          fi
          ls -l src-tauri/binaries

      # ------------------------------------------------------------------
      # Den Server mit allem zusammenstellen, was er zur Laufzeit braucht
      #
      # Die Produktionspakete werden in einem Nebenverzeichnis installiert,
      # damit das node_modules des Bau-Vorgangs unangetastet bleibt: Der
      # Tauri-Schritt danach braucht die Entwicklungspakete noch.
      # ------------------------------------------------------------------
      - name: Server-Laufzeit zusammenstellen
        run: |
          set -e
          rm -rf src-tauri/server-runtime
          mkdir -p src-tauri/server-runtime/dist
          cp dist/server.cjs src-tauri/server-runtime/server.cjs
          cp -r dist/. src-tauri/server-runtime/dist/
          rm -f src-tauri/server-runtime/dist/server.cjs src-tauri/server-runtime/dist/server.cjs.map

          NEBENAN="$RUNNER_TEMP/vm-prod"
          rm -rf "$NEBENAN" && mkdir -p "$NEBENAN"
          cp package.json package-lock.json "$NEBENAN/"
          (cd "$NEBENAN" && npm ci --omit=dev --no-audit --ignore-scripts)
          cp -r "$NEBENAN/node_modules" src-tauri/server-runtime/node_modules

          echo "Inhalt der Server-Laufzeit:"
          ls -l src-tauri/server-runtime
          test -f src-tauri/server-runtime/dist/index.html
          test -f src-tauri/server-runtime/server.cjs

      - name: Build Desktop Application (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: 'npm run tauri'
          # Woher die Marke kommt, hängt davon ab, wie der Bau gestartet wurde:
          # Beim Knopfdruck ("Run workflow") gilt die eingetippte Versionsnummer,
          # sonst der Name der Marke, deren Veröffentlichung den Bau ausgelöst hat.
          #
          # Vorher stand hier "github.ref_name || github.event.inputs.version".
          # Das war falsch herum: Beim Knopfdruck enthält ref_name den Branchnamen
          # — also "main" —, und weil der nie leer ist, wurde die eingetippte
          # Nummer gar nicht erst angeschaut. GitHub legte dann eine Marke
          # namens "main" an. Genau die hat uns beim Hochladen im Weg gestanden.
          #
          # Bleiben beide Felder leer, legt tauri-action gar kein Release an und
          # baut nur. Das ist der Testbau: Die Pakete hängt der Schritt darunter
          # an den Lauf, und im Repository entsteht weder Marke noch Release.
          tagName: ${{ env.VM_VEROEFFENTLICHEN == 'ja' && env.VM_MARKE || '' }}
          releaseName: ${{ env.VM_VEROEFFENTLICHEN == 'ja' && format('VereinsManager {0}', env.VM_MARKE) || '' }}
          releaseBody: |
            ## VereinsManager ${{ env.VM_MARKE }}

            Kostenlose Vereinsverwaltung für gemeinnützige Vereine, vollständig lokal:
            Ihre Daten bleiben auf Ihrem Rechner bzw. Handy.

            > **Frühe Fassung.** Die App wird noch entwickelt und ist bisher nur in einem
            > Verein im Einsatz. Legen Sie regelmäßig eine Datensicherung an
            > (Einstellungen → Datensicherung).

            ### Downloads
            - **Windows:** `…_x64-setup.exe` (Installationsprogramm)
            - **macOS:** `….dmg` (Apple Silicon: M1 und neuer)
            - **Linux:** `….AppImage` (vor dem ersten Start als ausführbar kennzeichnen, siehe `DESKTOP_RELEASE.md`)
            - **Android:** `…_android.apk` (ab Android 8)

            ### Hinweise zur Installation
            Die Programme sind (noch) nicht bei Microsoft oder Apple registriert. Deshalb warnen die Systeme:
            - **Windows** zeigt „Der Computer wurde durch Windows geschützt“: auf **„Weitere Informationen“** und dann **„Trotzdem ausführen“** klicken.
            - **macOS** verweigert den ersten Start: Rechtsklick auf die App → **„Öffnen“**, dann bestätigen. Hilft das nicht: Systemeinstellungen → Datenschutz & Sicherheit → **„Dennoch öffnen“**.
            - **Android** fragt, ob Apps aus dieser Quelle (z. B. dem Browser) installiert werden dürfen: einmal erlauben.

            Wer schon eine ältere Fassung hat: vorher eine Datensicherung anlegen.

            Die Desktop-Fassung bringt einen kleinen Anwendungsserver mit, der
            ausschließlich auf diesem Rechner lauscht (`127.0.0.1`) und aus dem
            Netzwerk nicht erreichbar ist. Nach draußen verbindet sich die App nur,
            wenn Sie selbst auf „Jetzt prüfen“ (Versionsprüfung) klicken.
          releaseDraft: false
          # Reguläre Veröffentlichung (Entscheidung Johannes, 25.11.2026). Bis
          # dahin stand hier "prerelease: true". Die Versionsprüfung der App
          # fragt aber nur nach der neuesten regulären Version und hätte so nie
          # etwas gefunden. Dass es eine frühe Fassung ist, steht im Text oben.
          prerelease: false
          args: ${{ matrix.args }}

      # ------------------------------------------------------------------
      # Testbau: die fertigen Pakete an den Lauf hängen
      #
      # Sie stehen dann unter "Artifacts" am Ende der Lauf-Übersicht zum
      # Herunterladen bereit — als ZIP, sieben Tage lang. Im Repository
      # entsteht nichts: kein Release, keine Marke, nichts, was jemand
      # versehentlich für die fertige Fassung halten könnte.
      #
      # Die zweite Pfadangabe ist für macOS: Wird mit "--target" gebaut, legt
      # Tauri seine Pakete eine Ebene tiefer ab.
      # ------------------------------------------------------------------
      - name: Pakete an den Lauf hängen (nur beim Testbau)
        if: env.VM_VEROEFFENTLICHEN != 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: vereinsmanager-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/*/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.exe

  # ------------------------------------------------------------------
  # Handy: signierte APK bauen und an dieselbe Veröffentlichung hängen
  #
  # Wartet auf den Desktop-Bau, weil der die Veröffentlichung anlegt. Läuft
  # auch, wenn ein Desktop-System scheitert (dann fehlt nur dessen Datei).
  #
  # Der Signierschlüssel kommt aus vier Secrets (Einstellungen des
  # Repositorys → Secrets and variables → Actions), siehe DESKTOP_RELEASE.md:
  #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORT,
  #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORT
  # Er wird nur für die Dauer des Baus in einem temporären Ordner abgelegt.
  # ------------------------------------------------------------------
  android:
    needs: [pruefen, release]
    if: ${{ !cancelled() && needs.pruefen.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VM_VEROEFFENTLICHEN: ${{ github.event_name != 'workflow_dispatch' && 'ja' || github.event.inputs.veroeffentlichen }}
      VM_MARKE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Signierschlüssel bereitstellen
        env:
          SCHLUESSEL: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SCHLUESSEL" ]; then
            echo "::error::Das Secret ANDROID_KEYSTORE_BASE64 fehlt. Anleitung: DESKTOP_RELEASE.md, Abschnitt „Handy: Signierschlüssel“."
            exit 1
          fi
          echo "$SCHLUESSEL" | base64 -d > "$RUNNER_TEMP/vereinsmanager.jks"
          echo "VM_ANDROID_KEYSTORE=$RUNNER_TEMP/vereinsmanager.jks" >> "$GITHUB_ENV"

      # Erst die Tests des Kerns, dann die Release-Fassung. Scheitert ein Test,
      # wird nichts veröffentlicht.
      - name: Tests und Release-Fassung bauen
        env:
          VM_ANDROID_KEYSTORE_PASSWORT: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
          VM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VM_ANDROID_KEY_PASSWORT: ${{ secrets.ANDROID_KEY_PASSWORT }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:assembleRelease

      # Eine signierte Fassung heißt app-release.apk; eine unsignierte hieße
      # app-release-unsigned.apk und ließe sich nicht installieren.
      - name: APK benennen
        run: |
          set -e
          QUELLE=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$QUELLE" ]; then
            echo "::error::Keine signierte APK entstanden. Vorhanden:"; ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          ZIEL="$RUNNER_TEMP/VereinsManager_${VM_MARKE#v}_android.apk"
          cp "$QUELLE" "$ZIEL"
          echo "VM_APK=$ZIEL" >> "$GITHUB_ENV"
          ls -l "$ZIEL"

      - name: Schlüssel wieder entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/vereinsmanager.jks"

      - name: APK an die Veröffentlichung hängen
        if: env.VM_VEROEFFENTLICHEN == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VM_MARKE" "$VM_APK" --clobber

      - name: APK an den Lauf hängen (nur beim Testbau)
        if: env.VM_VEROEFFENTLICHEN != 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: vereinsmanager-android
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.VM_APK }}
