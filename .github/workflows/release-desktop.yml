name: "VereinsManager Desktop Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (z. B. v0.9.0)'
        required: true
        default: 'v0.9.0'
      veroeffentlichen:
        description: 'Als Release veröffentlichen? "nein" = nur bauen, Pakete hängen am Lauf'
        required: true
        type: choice
        options:
          - 'nein'
          - 'ja'
        default: 'nein'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  release:
    permissions:
      contents: write
    env:
      # Einmal an einer Stelle entschieden, statt die Bedingung unten dreimal
      # auszuschreiben.
      #
      # Wird der Bau durch das Veröffentlichen einer Marke ausgelöst, soll immer
      # ein Release entstehen — dann gibt es das Auswahlfeld gar nicht.
      VM_VEROEFFENTLICHEN: ${{ github.event_name != 'workflow_dispatch' && 'ja' || github.event.inputs.veroeffentlichen }}
      VM_MARKE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: nur Apple Silicon. Die frühere Universal-Fassung enthielt
          # zusätzlich die Intel-Bauform — und damit künftig auch eine zweite
          # Node-Laufzeitumgebung. Doppelter Platzbedarf für Geräte, die nicht
          # mehr unterstützt werden sollen.
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Frontend Dependencies
        # npm ci installiert exakt die in package-lock.json festgeschriebenen
        # Versionen. Wichtig für reproduzierbare Releases: derselbe Tag ergibt
        # dieselben Abhängigkeiten, auch Monate später.
        run: npm ci --no-audit

      # Erzeugt dist/ (Oberfläche) UND dist/server.cjs (Server). Früher stand
      # hier nur "build:ui" — den Server brauchte die Desktop-Fassung ja nicht.
      - name: Build Frontend & Server
        run: npm run build

      # ------------------------------------------------------------------
      # Die Node-Laufzeitumgebung als Sidecar bereitstellen
      #
      # Genommen wird schlicht das Node, das im Schritt "Setup Node.js" ohnehin
      # auf dem Bau-Rechner steht. Das erspart einen Download samt Prüfsumme
      # und stellt sicher, dass ausgeliefert wird, womit auch gebaut wurde.
      #
      # Tauri verlangt im Dateinamen die Plattformkennung ("target triple").
      # rustc kennt sie; sie von Hand zu pflegen wäre eine Fehlerquelle.
      # ------------------------------------------------------------------
      - name: Node-Laufzeitumgebung als Sidecar bereitstellen
        run: |
          set -e
          mkdir -p src-tauri/binaries
          KENNUNG=$(rustc -vV | sed -n 's|^host: ||p')
          QUELLE=$(node -p "process.execPath")
          echo "Plattformkennung: $KENNUNG"
          echo "Node-Programmdatei: $QUELLE"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$QUELLE" "src-tauri/binaries/vm-node-$KENNUNG.exe"
          else
            cp "$QUELLE" "src-tauri/binaries/vm-node-$KENNUNG"
            chmod +x "src-tauri/binaries/vm-node-$KENNUNG"
          fi
          ls -l src-tauri/binaries

      # ------------------------------------------------------------------
      # Den Server mit allem zusammenstellen, was er zur Laufzeit braucht
      #
      # Die Produktionspakete werden in einem Nebenverzeichnis installiert,
      # damit das node_modules des Bau-Vorgangs unangetastet bleibt: Der
      # Tauri-Schritt danach braucht die Entwicklungspakete noch.
      # ------------------------------------------------------------------
      - name: Server-Laufzeit zusammenstellen
        run: |
          set -e
          rm -rf src-tauri/server-runtime
          mkdir -p src-tauri/server-runtime/dist
          cp dist/server.cjs src-tauri/server-runtime/server.cjs
          cp -r dist/. src-tauri/server-runtime/dist/
          rm -f src-tauri/server-runtime/dist/server.cjs src-tauri/server-runtime/dist/server.cjs.map

          NEBENAN="$RUNNER_TEMP/vm-prod"
          rm -rf "$NEBENAN" && mkdir -p "$NEBENAN"
          cp package.json package-lock.json "$NEBENAN/"
          (cd "$NEBENAN" && npm ci --omit=dev --no-audit --ignore-scripts)
          cp -r "$NEBENAN/node_modules" src-tauri/server-runtime/node_modules

          echo "Inhalt der Server-Laufzeit:"
          ls -l src-tauri/server-runtime
          test -f src-tauri/server-runtime/dist/index.html
          test -f src-tauri/server-runtime/server.cjs

      - name: Build Desktop Application (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: 'npm run tauri'
          # Woher die Marke kommt, hängt davon ab, wie der Bau gestartet wurde:
          # Beim Knopfdruck ("Run workflow") gilt die eingetippte Versionsnummer,
          # sonst der Name der Marke, deren Veröffentlichung den Bau ausgelöst hat.
          #
          # Vorher stand hier "github.ref_name || github.event.inputs.version".
          # Das war falsch herum: Beim Knopfdruck enthält ref_name den Branchnamen
          # — also "main" —, und weil der nie leer ist, wurde die eingetippte
          # Nummer gar nicht erst angeschaut. GitHub legte dann eine Marke
          # namens "main" an. Genau die hat uns beim Hochladen im Weg gestanden.
          #
          # Bleiben beide Felder leer, legt tauri-action gar kein Release an und
          # baut nur. Das ist der Testbau: Die Pakete hängt der Schritt darunter
          # an den Lauf, und im Repository entsteht weder Marke noch Release.
          tagName: ${{ env.VM_VEROEFFENTLICHEN == 'ja' && env.VM_MARKE || '' }}
          releaseName: ${{ env.VM_VEROEFFENTLICHEN == 'ja' && format('VereinsManager {0}', env.VM_MARKE) || '' }}
          releaseBody: |
            ## VereinsManager Desktop — Vorabversion

            **Das ist eine Vorabversion.** Die Anwendung wird noch entwickelt;
            Fehler sind zu erwarten, und einzelne Funktionen können sich von
            Fassung zu Fassung ändern. Für den Echtbetrieb eines Vereins ist sie
            noch nicht gedacht.

            Ein Standalone-Paket für alle Betriebssysteme, vollständig lokal.

            ### Downloads:
            - **Windows**: `.exe` (Installer / Standalone) oder `.msi`
            - **macOS**: `.dmg` (Apple Silicon: M1 und neuer)
            - **Linux**: `.AppImage` oder `.deb`

            *Keine Installation von Node.js oder Webservern erforderlich. Einfach herunterladen und per Doppelklick starten.*

            Seit dieser Fassung bringt das Programm den Anwendungsserver mit.
            Dadurch funktionieren auch in der Desktop-Fassung der E-Mail-Versand,
            die Belegerkennung und die KI-Funktionen. Das Paket ist dadurch um
            etwa 30 MB gewachsen.
          releaseDraft: false
          # Als Vorabversion gekennzeichnet: GitHub zeigt sie dann nicht als
          # "Latest release" an, und niemand lädt sie versehentlich in dem
          # Glauben herunter, das sei die fertige Fassung.
          prerelease: true
          args: ${{ matrix.args }}

      # ------------------------------------------------------------------
      # Testbau: die fertigen Pakete an den Lauf hängen
      #
      # Sie stehen dann unter "Artifacts" am Ende der Lauf-Übersicht zum
      # Herunterladen bereit — als ZIP, sieben Tage lang. Im Repository
      # entsteht nichts: kein Release, keine Marke, nichts, was jemand
      # versehentlich für die fertige Fassung halten könnte.
      #
      # Die zweite Pfadangabe ist für macOS: Wird mit "--target" gebaut, legt
      # Tauri seine Pakete eine Ebene tiefer ab.
      # ------------------------------------------------------------------
      - name: Pakete an den Lauf hängen (nur beim Testbau)
        if: env.VM_VEROEFFENTLICHEN != 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: vereinsmanager-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/*/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.deb
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.exe
            src-tauri/target/*/release/bundle/**/*.msi
