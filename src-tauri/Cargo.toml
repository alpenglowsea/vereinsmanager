[package]
name = "vereinsmanager"
version = "1.0.0"
description = "VereinsManager - Revisionssichere Vereinsverwaltung"
authors = ["VereinsManager Team"]
license = "MIT"
repository = "https://github.com/strelitzerfc/vereinsmanager"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
